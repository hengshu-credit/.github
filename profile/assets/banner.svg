      <stop stop-color="#101B3D"/>
      <stop offset="0.55" stop-color="#18264E"/>
      <stop offset="1" stop-color="#38216A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
