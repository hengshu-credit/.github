    <text x="72" y="167" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="2">HENGSHU CREDIT</text>
    <text x="76" y="216" fill="#C7D4F3" font-family="Arial, Helvetica, sans-serif" font-size="25">Data into decisions. Technology into possibilities.</text>
