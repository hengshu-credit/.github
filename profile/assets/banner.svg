<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Hengshu Credit</title>
  <desc id="description">Open-source tools and platforms for risk modeling, decisions, marketing and commerce.</desc>
  <defs>
