    <linearGradient id="connections" x1="1110" y1="100" x2="1470" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#51BEFF"/>
      <stop offset="1" stop-color="#B382FF"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1600" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
